# Veli Akademisi · nginx site ayarı
# /etc/nginx/sites-available/veliakademisi olarak kopyalanır. HTTPS satırlarını certbot kendisi ekler.
server {
    listen 80;
    listen [::]:80;
    server_name veliakademisi.bep-uda-projeler.com;

    access_log /var/log/nginx/veliakademisi-erisim.gunluk va_gizli;
    error_log  /var/log/nginx/veliakademisi-hata.gunluk;

    client_max_body_size 1m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # --- ÖNİZLEME ŞİFRESİ: yayına alınca bu iki satır silinir (KURULUM.md, "Yayına alma") ---
    auth_basic           "Veli Akademisi onizleme";
    auth_basic_user_file /etc/nginx/veliakademisi-onizleme.htpasswd;

    # Telefonun "ana ekrana ekle" sırasında şifresiz istediği iki şey: uygulama tanımı ve simgeler.
    location ~ ^/v/[A-Za-z0-9_-]+/manifest\.webmanifest$ {
        auth_basic off;
        proxy_pass http://127.0.0.1:5080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /simge/ {
        auth_basic off;
        proxy_pass http://127.0.0.1:5080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:5080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
