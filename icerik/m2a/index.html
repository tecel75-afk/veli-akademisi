<html lang="tr">
<title>Veli Akademisi · Elif'in Kalpleri</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Tek sütun, telefon önce: görsel üstte, yazı kartı altta, büyük düğmeler başparmak bölgesinde. */
:root{
  --bg:#EEF2F1; --surface:#FFFFFF; --ink:#1E2B2E; --muted:#5B6B6E;
  --accent:#1E6B66; --accent-ink:#FFFFFF; --line:#D5DEDC;
  --o1:#F6C8A4; --o2:#BFDCC6; --o3:#C3D3EE; --sel:#1E6B66; --soft:#E2EEEC;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121A1B; --surface:#1B2628; --ink:#E8EFEE; --muted:#A3B3B2; --accent:#5FB7AE; --accent-ink:#0E1A1A;
  --line:#2C3A3C; --o1:#5A3F2C; --o2:#2F4A37; --o3:#2F3D57; --sel:#5FB7AE; --soft:#22322F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121A1B; --surface:#1B2628; --ink:#E8EFEE; --muted:#A3B3B2; --accent:#5FB7AE; --accent-ink:#0E1A1A;
  --line:#2C3A3C; --o1:#5A3F2C; --o2:#2F4A37; --o3:#2F3D57; --sel:#5FB7AE; --soft:#22322F; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.5}
.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:14px;
  padding-block:12px 20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:center;gap:10px}
.brand{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.sec{font-size:14px;color:var(--muted);margin-left:auto;font-weight:700}
.top{flex-wrap:wrap}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.stage{display:flex;flex-direction:column;gap:14px;flex:1}
.pic{width:100%;max-width:100%;aspect-ratio:1/1;border-radius:18px;object-fit:cover;background:var(--line);display:block}
.card{background:var(--surface);border-radius:18px;padding:18px 18px;border:1px solid var(--line)}
.text{font-size:21px;font-weight:700;line-height:1.45;text-wrap:pretty}
.h1{font-family:var(--display);font-size:32px;line-height:1.15;font-weight:700;text-wrap:balance;margin:0}
.h2{font-family:var(--display);font-size:24px;line-height:1.2;font-weight:700;text-wrap:balance;margin:0}
.eyebrow{font-size:14px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hero{position:relative;border-radius:18px;overflow:hidden}
.hero .pic{filter:saturate(.9)}
.hero .over{position:absolute;inset:auto 0 0 0;padding:20px;background:linear-gradient(transparent,rgba(10,20,22,.82));color:#fff;display:flex;flex-direction:column;gap:6px}
.hero .over .eyebrow{color:#cfe6e2}
.opts{display:flex;flex-direction:column;gap:12px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:3px solid transparent;border-radius:16px;padding:14px 16px;
  font:inherit;font-size:19px;font-weight:700;color:var(--ink);cursor:pointer;min-height:72px}
.opt .n{flex:none;width:46px;height:46px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-family:var(--display);font-size:24px}
.opt[data-i="0"]{background:var(--o1)}.opt[data-i="1"]{background:var(--o2)}.opt[data-i="2"]{background:var(--o3)}
.opt.on{border-color:var(--sel)}
.opt.dim{opacity:.45}
.opt:focus-visible,.btn:focus-visible,.icon:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.fb{background:var(--soft);border-radius:16px;padding:16px 18px;font-size:19px;font-weight:700;line-height:1.5}
.fb b{display:block;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
[hidden]{display:none!important}
.nav{display:flex;gap:10px;position:sticky;bottom:0;padding-block:10px calc(4px + env(safe-area-inset-bottom,0px));background:var(--bg)}
.btn{flex:1;min-height:60px;border-radius:16px;border:0;font:inherit;font-size:20px;font-weight:800;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
.btn[disabled]{opacity:.35;cursor:not-allowed}
.start{display:flex;flex-direction:column;gap:14px}
.start .btn{flex:none}
.text{transition:opacity .25s}
.icon{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;font:inherit;font-size:14px;font-weight:800;padding:8px 12px;cursor:pointer}
.icon[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.think{display:flex;flex-direction:column;gap:12px}
.pill{align-self:flex-start;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:4px 14px;font-size:14px;font-weight:800;letter-spacing:.04em}
.note{font-size:16px;color:var(--muted);font-weight:700}
/* Soru ve düşünme ekranı: son sahnenin karartılmış görseli üzerinde açılır */
.ustu{position:relative;border-radius:18px;overflow:hidden;padding:14px;min-height:60vh}
.ustu .perde{position:absolute;inset:-8px;background:center/cover no-repeat;filter:brightness(.6) blur(1px)}
.ustu .icerik{position:relative;display:flex;flex-direction:column;gap:12px}
.ustu .note{color:#E8EFEE}
/* Köprü: rehberin merak cümlesi farklı renkli kartta, anlatıcının cümlesi normal kartta */
.card.rehber{background:var(--soft);border-color:var(--accent)}
.close p{margin:0;font-size:20px;font-weight:700;line-height:1.5}
.close{display:flex;flex-direction:column;gap:12px}
@media (prefers-reduced-motion: reduce){.bar i{transition:none}}
</style>

<script>
const STEPS = [{"t": "section", "n": 1, "title": "1. Bölüm", "sub": "Sorun ve çaresizlik"}, {"t": "frame", "img": "img/m2a_b1_kare1.webp", "text": "Cumartesi sabahı Elif, annesi Gülay ve babası Ahmet'le pazara gitti.", "sec": 1}, {"t": "frame", "img": "img/m2a_b1_kare1.webp", "text": "Elif herkese gülümsüyor.", "sec": 1}, {"t": "frame", "img": "img/m2a_b1_kare1.webp", "text": "Sebzeciye elleriyle kalp yaptı.", "sec": 1}, {"t": "frame", "img": "img/m2a_b1_kare2.webp", "text": "Meyve tezgâhında sırada bekleyen, hiç tanımadıkları bir kadına koştu ve ona sarıldı.", "sec": 1}, {"t": "frame", "img": "img/m2a_b1_kare2.webp", "text": "Kadın şaşırdı. Annesi kıpkırmızı oldu.", "sec": 1}, {"t": "frame", "img": "img/m2a_b1_kare3.webp", "text": "Annesi Elif'in kolundan tutup çekti: “Elif, sarılma! Kaç kere söyledim!”", "sec": 1}, {"t": "frame", "img": "img/m2a_b1_kare3.webp", "text": "Elif'in yüzü düştü. Ne yanlış yaptığını anlamadı.", "sec": 1}, {"t": "q", "q": "Elif tanımadığı birine sarıldı. Sizce Elif bunu neden yapmış olabilir?", "o": ["Şımarıklık yapıyor.", "Kimin tanıdık kimin yabancı olduğunu henüz ayırt edemiyor.", "İlgi görmek istiyor."], "fb": ["Öyle görünebilir. Ama Elif'in yüzüne bakalım: kötü bir niyeti yok, sevgisini gösteriyor. Belki de kime sarılınır, kime sarılmaz, bunu henüz bilmiyor.", "Evet, çok önemli bir nokta. Elif için herkes sevgiyi hak ediyor. Tanıdık ile yabancıyı ayırmak öğretilmesi gereken bir beceri.", "Olabilir, insanlar ona gülümseyince mutlu oluyor. Ama bir de şuna bakalım: Elif tanıdık ile yabancıyı ayırt edebiliyor mu?"], "sec": 1, "all": false, "lb": ["Bir de şöyle bakalım.", "Çok yerinde bir tespit!", "Birlikte düşünelim."], "ov": {"i": 1, "t": "Çok yerinde bir tespit!"}, "bridge": {"e": "Haydi hikâyemize dönelim. Bakalım ertesi gün neler olacak?", "n": "Gülay o gün pazardan eve düşünceli döndü."}}, {"t": "frame", "img": "img/m2a_b1_kare4.webp", "text": "Ertesi gün apartmanda kapıcıya da sarıldı.", "sec": 1}, {"t": "frame", "img": "img/m2a_b1_kare4.webp", "text": "Akşam otobüste yanına oturan birine kalp yaptı.", "sec": 1}, {"t": "frame", "img": "img/m2a_b1_kare4.webp", "text": "Annesi her seferinde “sarılma” dedi.", "sec": 1}, {"t": "frame", "img": "img/m2a_b1_kare4.webp", "text": "Elif her seferinde üzüldü, ama yine yaptı.", "sec": 1}, {"t": "q", "q": "Annesi her seferinde “sarılma” dedi, ama Elif yine sarıldı. Sizce neden işe yaramadı?", "o": ["Daha sert söylemek gerekiyordu.", "Elif'e sarılmak yerine ne yapacağı söylenmedi.", "Elif kuralı anlayamaz."], "fb": ["Bu çok anlaşılır bir düşünce; insan endişelenince sesi yükselir. Ama Elif bağırınca yalnızca üzüldü. Sizce Elif ne yapması gerektiğini biliyor muydu?", "Evet, işin anahtarı bu. “Sarılma” denince Elif'in elinde hiçbir şey kalmıyor. Sevgisini başka nasıl gösterebileceğini öğrenmesi gerekiyor.", "Bunu düşünen çok anne baba var. Ama Down sendromlu çocuklar resimlerle, tekrarla ve örnek görerek çok şey öğrenebilir. Belki de kural ona doğru yoldan anlatılmadı."], "sec": 1, "all": false, "lb": ["Bir de şöyle bakalım.", "Harika, sorunun özünü yakaladınız!", "Birlikte düşünelim."], "ov": {"i": 1, "t": "Harika, sorunun özünü yakaladınız!"}, "bridge": {"e": "Haydi devam edelim. Sizce Gülay ile Ahmet bu durumu nasıl çözecek?", "n": "Elif yine birine sarılmış, yine üzülmüştü."}}, {"t": "frame", "img": "img/m2a_b1_kare5.webp", "text": "Gece anne ve baba salonda oturuyor.", "sec": 1}, {"t": "frame", "img": "img/m2a_b1_kare5.webp", "text": "Annesi fısıldadı: “Ya bir gün kötü niyetli birine sarılırsa? Onu nasıl koruyacağız?”", "sec": 1}, {"t": "frame", "img": "img/m2a_b1_kare5.webp", "text": "Babası başını eğdi: “Bilmiyorum. Kızmak da işe yaramıyor.”", "sec": 1}, {"t": "think", "q": "Sizin çocuğunuz sevgisini nasıl gösteriyor? Bu sizi hangi durumlarda endişelendiriyor?", "sec": 1, "bridge": {"e": "Haydi hikâyemize devam edelim. Belki de cevap, küçük bir ekranda bekliyor.", "n": null}}, {"t": "section", "n": 2, "title": "2. Bölüm", "sub": "Başkasının deneyimi"}, {"t": "frame", "img": "img/m2a_b2_kare1.webp", "text": "Birkaç gün sonra annesi telefonda bir video açtı.", "sec": 2}, {"t": "frame", "img": "img/m2a_b2_kare1.webp", "text": "İki öğretmen konuşuyordu; konu çocuklarda mahremiyetti.", "sec": 2}, {"t": "frame", "img": "img/m2a_b2_kare1.webp", "text": "Babasını yanına çağırdı: “Gel, bunu birlikte dinleyelim.”", "sec": 2}, {"t": "frame", "img": "img/m2a_b2_kare2.webp", "text": "“Pek çok anne baba bize aynı şeyi soruyor: Çocuğum herkese sarılıyor, ne yapayım?”", "sec": 2}, {"t": "frame", "img": "img/m2a_b2_kare2.webp", "text": "“Sadece ‘sarılma’ demek yetmez. Çocuğa sevgisini başka nasıl göstereceğini de öğretmeliyiz.”", "sec": 2}, {"t": "frame", "img": "img/m2a_b2_kare2.webp", "text": "“El sallamak, beşlik çakmak, uzaktan kalp yapmak gibi.”", "sec": 2}, {"t": "frame", "img": "img/m2a_b2_kare3.webp", "text": "“Bunun için kartlar çok işe yarar. Üç halka düşünün.”", "sec": 2}, {"t": "frame", "img": "img/m2a_b2_kare3.webp", "text": "“En içte aile: anne, baba, kardeş. Onlara sarılabiliriz.”", "sec": 2}, {"t": "frame", "img": "img/m2a_b2_kare3.webp", "text": "“Ortada tanıdıklar: öğretmen, komşu. Onlara el sıkarız ya da el sallarız.”", "sec": 2}, {"t": "frame", "img": "img/m2a_b2_kare3.webp", "text": "“En dışta tanımadığımız insanlar. Onlara uzaktan el sallarız.”", "sec": 2}, {"t": "frame", "img": "img/m2a_b2_kare3.webp", "text": "“Halkalara aile fotoğraflarını koyabilirsiniz.”", "sec": 2}, {"t": "frame", "img": "img/m2a_b2_kare4.webp", "text": "“Mahremiyet evde başlar. Tuvalet ve banyo kapısı kapanır.”", "sec": 2}, {"t": "frame", "img": "img/m2a_b2_kare4.webp", "text": "“Giyinip soyunma kendi odasında, kapı kapalı yapılır. Odaya girerken kapı çalınır.”", "sec": 2}, {"t": "frame", "img": "img/m2a_b2_kare4.webp", "text": "“Bunu anne baba da yapmalı; çocuk görerek öğrenir.”", "sec": 2}, {"t": "frame", "img": "img/m2a_b2_kare5.webp", "text": "“Bir de şu var: Çocuğun bedeni ona aittir. İstemediğinde ‘hayır’ diyebilmeli.”", "sec": 2}, {"t": "frame", "img": "img/m2a_b2_kare5.webp", "text": "“Bu yüzden büyükler de onu zorla öpmemeli, kucaklamamalı.”", "sec": 2}, {"t": "frame", "img": "img/m2a_b2_kare5.webp", "text": "“Bir şey onu rahatsız ederse size ya da öğretmenine gelip anlatmasını öğretin.”", "sec": 2}, {"t": "frame", "img": "img/m2a_b2_kare5.webp", "text": "“Ve unutmayın: bütün aile aynı kuralı uygulamalı, okul da aynı kartları kullanmalı.”", "sec": 2}, {"t": "q", "q": "Uzmanların anlattıklarından hangisiyle başlamak size en kolay gelir?", "o": ["Kartlarla aile, tanıdık ve yabancıyı göstermek.", "Evde kapı kurallarını başlatmak.", "Sarılmak yerine el sallamayı öğretmek."], "fb": ["Güzel bir başlangıç. Kendi aile fotoğraflarınızla yaparsanız çocuğunuz kimin halkada nerede durduğunu daha kolay anlar. Kimleri koyardınız?", "Güzel bir başlangıç. Kapı kuralı her gün tekrarlandığı için çabuk alışkanlık olur. Evde siz de kapıyı çalarak girerseniz çocuğunuz sizi örnek alır.", "Güzel bir başlangıç. Çocuğunuzun sevgisi yasaklanmamış olur, yalnızca yönü değişir. Sizce çocuğunuz en çok hangisini sever: el sallamak mı, beşlik mi?"], "sec": 2, "all": true}, {"t": "think", "q": "Sizin evinizde tuvalet, banyo ve giyinme sırasında kapılar kapalı mı? Evdeki büyükler bu konuda örnek oluyor mu?", "sec": 2, "bridge": {"e": "Haydi hikâyemize dönelim. Bakalım Gülay ile Ahmet bu fikirleri evde nasıl uygulayacak?", "n": null}}, {"t": "section", "n": 3, "title": "3. Bölüm", "sub": "Uyarlama ve azalma"}, {"t": "frame", "img": "img/m2a_b3_kare1.webp", "text": "O akşam anne ve baba masaya oturdu. Büyük bir kartona üç halka çizdiler.", "sec": 3}, {"t": "frame", "img": "img/m2a_b3_kare1.webp", "text": "En içe anne, baba ve dedenin fotoğraflarını yapıştırdılar.", "sec": 3}, {"t": "frame", "img": "img/m2a_b3_kare1.webp", "text": "Ortaya öğretmenin ve komşu Nermin Teyze'nin.", "sec": 3}, {"t": "frame", "img": "img/m2a_b3_kare1.webp", "text": "En dışa, hiç tanımadıkları insanları gösteren resimler koydular.", "sec": 3}, const OK = ["Güzel bir fark ediş.","Birlikte düşünelim.","Bir de şöyle bakalım."];
let i = -1; const answers = {}; let paused = false; let timer = null; let token = 0;

const canSpeak = 'speechSynthesis' in window;
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function estimate(t){ return Math.max(2600, 900 + t.split(/\s+/).length * 430); }

const player = new Audio(); player.preload = 'auto';
// Adımın ses dosyası: ses/m1_s001.mp3; soru geri bildirimi: ses/m1_s013_c1.mp3
function srcFor(k, c){ return 'ses/m2a_s'+String(k+1).padStart(3,'0')+(c==null?'':'_c'+(c+1))+'.mp3'; }
const GAP = 350;  // iki cümle arasındaki ek bekleme (ms); kayıtların kendi sonunda da kısa bir sessizlik var
// Sonraki iki adımın ses dosyasını önceden indirir; telefonda cümleler arasında yükleme beklemesi olmaz.
const onYuk = {};
function preload(){ for(let k=i+1; k<=i+2 && k<STEPS.length; k++){ const s=STEPS[k]; if(s.t==='q') continue;
  const u = srcFor(k); if(!onYuk[u]){ const a = new Audio(); a.preload = 'auto'; a.src = u; onYuk[u] = a; } } }
// Ortam sesi: kayıttaki hafif arka plan sesinin aynısı. Hikâye akarken alttan kesintisiz çalar,
// böylece cümle bitince ses birden kesilmiş gibi duyulmaz. Sorularda yavaşça kısılır.
let ac = null, bedGain = null, bedOn = false;
const BED_GAP = 0.12, BED_SPEECH = 0.08;  // ortam sesi: cümle aralarında %12, Nursel konuşurken %8
function bedLevel(v){ try{ if(bedOn && ac && bedGain){ bedGain.gain.cancelScheduledValues(ac.currentTime); bedGain.gain.setTargetAtTime(v, ac.currentTime, 0.12); } }catch(e){} }
function bedStart(){ try{
  if(!ac){
    ac = new (window.AudioContext || window.webkitAudioContext)();
    bedGain = ac.createGain(); bedGain.gain.value = 0; bedGain.connect(ac.destination);
    fetch('ses/ortam.wav').then(r=>r.arrayBuffer()).then(b=>new Promise((ok,no)=>ac.decodeAudioData(b,ok,no))).then(buf=>{
      const src = ac.createBufferSource(); src.buffer = buf; src.loop = true; src.connect(bedGain); src.start();
    }).catch(()=>{});
  }
  if(ac.state !== 'running') ac.resume();
  bedGain.gain.cancelScheduledValues(ac.currentTime);
  bedOn = true;
  bedGain.gain.setTargetAtTime(BED_GAP, ac.currentTime, 0.25);
}catch(e){} }
const BED_SOFT = 0.05;  // soru ve düşünme ekranında ortam sesi
function bedSoft(){ bedLevel(BED_SOFT); }
function bedStop(){ bedOn = false; try{ if(ac && bedGain){ bedGain.gain.cancelScheduledValues(ac.currentTime); bedGain.gain.setTargetAtTime(0, ac.currentTime, 0.5); } }catch(e){} }
// Önce kayıtlı ses dosyasını çalar. Dosya yoksa ya da çalınamazsa tarayıcının sesiyle okur.
// Hiç ses yoksa okuma süresi kadar bekler. Bitince done() çağrılır.
function say(t, done, src){
  const my = ++token; clearTimeout(timer);
  const finish = ()=>{ if(my!==token) return; bedLevel(BED_GAP); clearTimeout(timer); if(done) timer = setTimeout(()=>{ if(my===token && !paused) done(); }, GAP); };
  const tts = ()=>{ if(my!==token) return; clearTimeout(timer); speakTTS(t, finish); };
  if(src){
    let dustu = false; const yedek = ()=>{ if(dustu || my!==token) return; dustu = true; tts(); };
    player.onended = finish; player.onerror = yedek; player.onplaying = ()=>{ if(my===token) bedLevel(BED_SPEECH); };
    player.src = src;
    const pr = player.play(); if(pr && pr.catch) pr.catch(yedek);
    timer = setTimeout(finish, estimate(t)*1.8 + 4000);  // onended gelmezse güvenlik
    return;
  }
  tts();

function speakTTS(t, finish){
  if(canSpeak){ try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(t); u.lang='tr-TR'; u.rate=0.9;
    const v = speechSynthesis.getVoices().find(v=>v.lang && v.lang.toLowerCase().startsWith('tr')); if(v) u.voice=v;
    u.onend = finish; u.onerror = ()=>{ clearTimeout(timer); timer = setTimeout(finish, estimate(t)); };  // okunamazsa okuma süresi kadar bekle
    speechSynthesis.speak(u);
    timer = setTimeout(finish, estimate(t)*1.8 + 2000);  // onend gelmezse güvenlik
    return; }catch(e){} }
  timer = setTimeout(finish, estimate(t));
}
function stopAll(){ token++; clearTimeout(timer); player.onended = player.onerror = player.onplaying = null; try{player.pause()}catch(e){}
  if(canSpeak) try{speechSynthesis.cancel()}catch(e){} }

function startScreen(){
  const first = STEPS.find(x=>x.img);
  stage.innerHTML = `<div class="hero"><img class="pic" src="${first.img}" alt=""><div class="over">
    <span class="eyebrow">Modül 2 · Mahremiyet</span><h1 class="h1">Elif'in Kalpleri</h1><span>Sesli bir hikâye. Yaklaşık 9 dakika sürer.</span></div></div>
    <div class="start"><p class="note" style="margin:0">Hikâye kendiliğinden ilerler. Sorularda durur ve sizin seçiminizi bekler. Sesi açmayı unutmayın.</p>
    <button class="btn" id="basla">Hikâyeyi başlat</button></div>`;
  document.getElementById('basla').onclick = ()=>{ bedStart(); i = 0; render(); };
  durBtn.hidden = tekrarBtn.hidden = basaBtn.hidden = true; nav.hidden = true;
}
function next(){ if(i < STEPS.length-1){ i++; render(); } }

function render(){
  stopAll(); kopru = null;
  const s = STEPS[i];
  durBtn.hidden = tekrarBtn.hidden = basaBtn.hidden = false; paused = false; durBtn.textContent='Duraklat'; durBtn.setAttribute('aria-pressed','false');
  document.getElementById('prog').style.width = ((i+1)/STEPS.length*100)+'%';
  document.getElementById('sec').textContent = s.sec ? (s.sec+'. bölüm') : '';
  nav.hidden = true; ileri.textContent = 'Devam';
  if(s.t==='section'){
    const first = STEPS.slice(i+1).find(x=>x.img);
    stage.innerHTML = `<div class="hero"><img class="pic" src="${first.img}" alt=""><div class="over">
      <span class="eyebrow">${esc(s.title)}</span><h1 class="h1">${esc(s.sub)}</h1></div></div>`;
    bedStart(); say(s.title+'. '+s.sub, next, srcFor(i)); preload();
  } else if(s.t==='frame'){
    const prev = STEPS[i-1];
    if(prev && prev.t==='frame' && prev.img===s.img && stage.querySelector('.text')){
      stage.querySelector('.text').textContent = s.text;      // aynı kare: yalnızca yazı değişir
    } else {
      stage.innerHTML = `<img class="pic" src="${s.img}" alt=""><div class="card"><p class="text" style="margin:0">${esc(s.text)}</p></div>`;
    }
    bedStart(); say(s.text, next, srcFor(i)); preload();
  } else if(s.t==='q'){
    drawQ(s);
    if(answers[i]===undefined) say(s.q+' '+s.o.map((o,k)=>['A','Be','Ce'][k]+' şıkkı: '+o).join(' '), bedSoft, srcFor(i)); else bedSoft();
  } else if(s.t==='think'){
    stage.innerHTML = ustu(`<div class="card think"><span class="pill">Biraz düşünelim</span><h2 class="h2">${esc(s.q)}</h2>${s.destek?`<p style="margin:0;font-size:19px;font-weight:800;color:var(--accent)">${esc(s.destek)}</p>`:''}
      <p class="note" style="color:var(--muted)">${s.destek?'Doğru cevabı yok. Hazır olduğunuzda devam edin.':'Doğru cevabı yok. Bu konuda destek almak ya da düşüncelerinizi paylaşmak için çocuğunuzun sınıf öğretmenine veya rehber öğretmenimize ulaşabilirsiniz. Hazır olduğunuzda devam edin.'}</p></div>`);
    nav.hidden = false;
    say(s.q+(s.destek?' '+s.destek:''), bedSoft, srcFor(i));
  } else if(s.t==='close'){
    stage.innerHTML = `<div class="card close"><span class="eyebrow">Modülün sonu</span>${s.lines.map((l,k)=>`<p${k>=5?' style="color:var(--accent)"':''}>${esc(l)}</p>`).join('')}</div>`;
    ileri.textContent = 'Baştan izle'; nav.hidden = false;
    say(s.lines.join(' '), bedStop, srcFor(i));

}
function drawQ(s){
  const a = answers[i];
  stage.innerHTML = ustu(`<div class="card"><span class="eyebrow">Sizce?</span><h2 class="h2" style="margin-top:6px">${esc(s.q)}</h2></div>
    <div class="opts">${s.o.map((o,k)=>`<button class="opt ${a===undefined?'':(a===k?'on':'dim')}" data-i="${k}" aria-pressed="${a===k}"><span class="n">${"ABC"[k]}</span><span>${esc(o)}</span></button>`).join('')}</div>
    ${a===undefined?'<p class="note">Size en yakın geleni seçin. Doğru ya da yanlış diye bir not verilmiyor.</p>':`<div class="fb"><b>${s.lb?esc(s.lb[a]):'Güzel bir seçim.'}</b>${esc(s.fb[a])}</div>`}`);
  stage.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    answers[i]=+b.dataset.i; drawQ(s); nav.hidden=false;
    const f=stage.querySelector('.fb'); if(f) f.scrollIntoView({behavior:'smooth',block:'nearest'});
    bedStart(); say(s.fb[+b.dataset.i], bedSoft, srcFor(i, +b.dataset.i));
  });
  nav.hidden = a===undefined;
}
function currentText(){ const s=STEPS[i]; if(!s) return '';
  if(kopru) return kopru.part===1 ? s.bridge.e : s.bridge.n;
  if(s.t==='frame') return s.text; if(s.t==='section') return s.title+'. '+s.sub; if(s.t==='think') return s.q+(s.destek?' '+s.destek:'');
  if(s.t==='close') return s.lines.join(' ');
  if(s.t==='q') return answers[i]===undefined ? s.q+' '+s.o.map((o,k)=>['A','Be','Ce'][k]+' şıkkı: '+o).join(' ') : s.fb[answers[i]]; }
function currentSrc(){ const s=STEPS[i]; if(!s) return null;
  if(kopru) return srcK(i, kopru.part);
  return (s.t==='q' && answers[i]!==undefined) ? srcFor(i, answers[i]) : srcFor(i); }
const autoNext = ()=>{ if(kopru) return kopruSonra(); const t=STEPS[i].t; return (t==='frame'||t==='section') ? next : (t==='close' ? bedStop : bedSoft); };
// Hikâyeye dönüş köprüsü: son sahne geri gelir, rehber (Emrullah) merak cümlesini söyler,
// ardından anlatıcı (Nursel) sahneyi hatırlatan cümleyi okur, sonra hikâye sürer.
let kopru = null;
function srcK(k, n){ return 'ses/m2a_s'+String(k+1).padStart(3,'0')+'_k'+n+'.mp3'; }
function sonSahne(k){ for(let j=k; j>=0; j--) if(STEPS[j].img) return STEPS[j].img; return STEPS.find(x=>x.img).img; }
function ustu(html){ return `<div class="ustu"><div class="perde" style="background-image:url('${sonSahne(i)}')"></div><div class="icerik">${html}</div></div>`; }
function kopruSonra(){ return ()=>{ if(kopru && kopru.part===1 && STEPS[i].bridge.n) kopruAdim(2); else next(); }; }
function kopruAdim(part){
  const s = STEPS[i]; kopru = {part};
  const metin = part===1 ? s.bridge.e : s.bridge.n;
  const kart = stage.querySelector('.kopru');
  kart.classList.toggle('rehber', part===1); kart.querySelector('.text').textContent = metin;
  bedStart(); say(metin, kopruSonra(), srcK(i, part));
}
function kopruBasla(){

  stage.innerHTML = `<img class="pic" src="${sonSahne(i)}" alt=""><div class="card kopru"><p class="text" style="margin:0"></p></div>`;
  window.scrollTo({top:0}); kopruAdim(1);
}
ileri.onclick = ()=>{ if(i===STEPS.length-1){ for(const k in answers) delete answers[k]; i=0; render(); }
  else if(STEPS[i].bridge && !kopru) kopruBasla(); else next(); };
durBtn.onclick = ()=>{
  paused = !paused; durBtn.textContent = paused ? 'Devam et' : 'Duraklat'; durBtn.setAttribute('aria-pressed', paused);
  if(paused){ stopAll(); bedStop(); } else { bedStart(); say(currentText(), autoNext(), currentSrc()); }

// Bölüm başı: bulunduğu bölümün başlık ekranına döner; zaten oradaysa bir önceki bölümün başına.
basaBtn.onclick = ()=>{

};
tekrarBtn.onclick = ()=>{ bedStart(); paused=false; durBtn.textContent='Duraklat'; durBtn.setAttribute('aria-pressed','false'); say(currentText(), autoNext(), currentSrc()); };
