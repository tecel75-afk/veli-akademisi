# Veli Akademisi · nginx günlük biçimi (KVKK, tanım bölüm 10)
# /etc/nginx/conf.d/ altına kopyalanır. Günlüğe tam IP adresi ve velinin gizli kodu yazılmaz:
#   IPv4'ün son bölümü 0 yapılır (ör. 85.105.12.0), IPv6'nın ilk üç bölümü dışı atılır;
#   adreslerdeki veli kodu "***" ile değiştirilir (ör. /v/***/m1/).
map $remote_addr $va_kisa_ip {
    ~^(?<a>\d+\.\d+\.\d+)\.\d+$                                    $a.0;
    ~^(?<b>[0-9a-fA-F]*:[0-9a-fA-F]*:[0-9a-fA-F]*):                $b::;
    default                                                        "-";
}
map $request_uri $va_kisa_adres {
    ~^/v/[^/?]+(?<geri>.*)$                                        /v/***$geri;
    default                                                        $request_uri;
}
log_format va_gizli '$va_kisa_ip [$time_local] "$request_method $va_kisa_adres" $status $body_bytes_sent';
